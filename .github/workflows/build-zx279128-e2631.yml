name: Build ZTE E2631 initramfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E2631 scaffold
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison bzip2 ccache clang flex gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            uuid-dev xz-utils zlib1g-dev file wget patch

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp -a target/linux/zx279128 openwrt/target/linux/

      - name: Prepare feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add swap
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_zx279128=y
          CONFIG_TARGET_zx279128_DEVICE_zte_e2631=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF
          make defconfig

      - name: Build initramfs image
        working-directory: openwrt
        run: |
          set -o pipefail
          if make -j2 V=s > ../build.log 2>&1; then
            :
          else
            status=$?
            echo "::error::Build failed with exit code ${status}"
            echo "::group::Last 500 lines from parallel build"
            tail -n 500 ../build.log || true
            echo "::endgroup::"
            echo "::group::Retry single-threaded to expose the first real error"
            make -j1 V=s >> ../build.log 2>&1 || {
              retry_status=$?
              tail -n 800 ../build.log || true
              exit ${retry_status}
            }
            echo "::endgroup::"
          fi
          find bin/targets/zx279128 -maxdepth 5 -type f | sort | tee ../artifacts.txt

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2631-openwrt-build-output
          path: |
            build.log
            artifacts.txt
            openwrt/bin/targets/zx279128/**
          if-no-files-found: warn
