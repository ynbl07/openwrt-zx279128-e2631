name: Build ZTE E2631 initramfs

on:
  workflow_dispatch:

env:
  OPENWRT_COMMIT: 486b4a4b3ede480635a185234fc624c969426f13

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E2631 scaffold
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison bzip2 ccache clang flex gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            uuid-dev xz-utils zlib1g-dev file wget patch

      - name: Clone OpenWrt
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth 1 origin "${OPENWRT_COMMIT}"
          git -C openwrt checkout --detach FETCH_HEAD
          cp -a target/linux/zx279128 openwrt/target/linux/

      - name: Prepare feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add swap
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_zx279128=y
          CONFIG_TARGET_zx279128_DEVICE_zte_e2631=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # CONFIG_GDB is not set
          EOF
          make defconfig

      - name: Restore OpenWrt host and toolchain cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-${{ env.OPENWRT_COMMIT }}-zx279128-toolchain-v1

      - name: Build initramfs image
        working-directory: openwrt
        run: |
          set -o pipefail
          if make -j2 V=s > ../build.log 2>&1; then
            :
          else
            status=$?
            echo "::error::Build failed with exit code ${status}"
            echo "::group::Last 500 lines from parallel build"
            tail -n 500 ../build.log || true
            echo "::endgroup::"
            echo "::group::Retry single-threaded to expose the first real error"
            make -j1 V=s >> ../build.log 2>&1 || {
              retry_status=$?
              tail -n 800 ../build.log || true
              exit ${retry_status}
            }
            echo "::endgroup::"
          fi
          find bin/targets/zx279128 -maxdepth 5 -type f | sort | tee ../artifacts.txt

      - name: Save OpenWrt host and toolchain cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2631-openwrt-build-output
          path: |
            build.log
            artifacts.txt
            openwrt/bin/targets/zx279128/**
          if-no-files-found: warn
